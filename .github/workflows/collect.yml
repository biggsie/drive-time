name: Collect drive times

# GitHub's hourly cron fired only about every 8 hours for this repo, so each run now
# stays alive for ~5.5 hours collecting at :17 past every hour
# (scripts/collect-loop.sh), then starts the next run itself. The cron below is a
# backstop that restarts the chain if it ever breaks; the loop skips a reading when
# the last one is under 50 minutes old, so overlaps never double up on API calls.
# Public repo: Actions minutes are free.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One run at a time; at most one more waits. A waiting run starts a fresh loop.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect hourly
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bash scripts/collect-loop.sh

      # Not on cancel, so cancelling a run in the Actions tab stops the chain
      # (the hourly cron will still restart it).
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${{ github.ref_name }}"

      # Belt and braces for GitHub's 60-day inactivity rule on public repos.
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
